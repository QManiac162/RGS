networks:
    railgate-net:
        driver: bridge

volumes:
    postgres_data:
    pgadmin_data:

services:
    postgres:
        image: postgres:16-alpine
        container_name: railgate-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
            APPOINTMENT_DB: ${APPOINTMENT_DB}
            NOTIFICATION_DB: ${NOTIFICATION_DB}
        ports:
            - "15432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./infra/postgres/init:/docker-entrypoint-initdb.d
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
        - railgate-net

    redis:
        image: redis:7-alpine
        container_name: railgate-redis
        restart: unless-stopped
        ports:
            - "${REDIS_PORT}:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
        - railgate-net

    kafka:
        image: apache/kafka:3.7.0
        container_name: railgate-kafka
        restart: unless-stopped
        ports:
            - "9094:9094"
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:90904
            KAFKA_ADVERTISED_LISTENER_NAMES: PLAINTTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_LISTENER_SECURITY__PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,
            PLAINTEXT_HOST: PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            CLUSTER_ID: ciWo7IWazngRchmPES6q5A==
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        healthcheck:
            test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
            interval: 10s
            timeout: 10s
            retries: 15
            start_period: 30s
        networks:
        - railgate-net

    pgadmin:
        image: dpage/pgadmin4:latest
        container_name: railgate-pgadmin
        restart: unless-stopped
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
        ports:
            - "5050:80"
        depends_on:
            - postgres
        volumes:
            - pgadmin_data:/var/lib/pgadmin
        networks:
        - railgate-net

    terminal-service:
        image: railgate-terminal-service:latest
        container_name: railgate-terminal-service
        restart: unless-stopped
        build:
            context: ./services/terminal-service
            dockerfile: Dockerfile
        environment:
            NODE_ENV: ${NODE_ENV}
            PORT: ${PORT}
            DB_HOST: postgres
            DB_PORT: "5432"
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
            REDIS_HOST: redis
            REDIS_PORT: "6379"
            LOCK_TTL_MS: "5000"
            LOCK_RETRY_COUNT: "5"
            LOCK_RETRY_DELAY_MS: "100"
            GAN_SEQUENCE_TTL_SECONDS: "172800"
        ports:
            - "${TERMINAL_SERVICE_PORT}:3000"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
        - railgate-net

    appointment-service:
        image: railgate-appointment-service:latest
        container_name: railgate-appointment-service
        restart: unless-stopped
        build:
            context: ./services/appointment-service
            dockerfile: Dockerfile
        environment:
            NODE_ENV: ${NODE_ENV}
            PORT: ${PORT}
            DB_HOST: postgres
            DB_PORT: "5432"
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            APPOINTMENT_DB: ${APPOINTMENT_DB}
            TERMINAL_SERVICE_URL: http://terminal-service:3000
            TERMINAL_CLIENT_BASE_URL: http://terminal-service:3000
            TERMINAL_CLIENT_TIMEOUT_MS: "5000"
            TERMINAL_CLIENT_RULES_CACHE_TTL_MS: "30000"
            RULES_CACHE_TTL_MS: "30000"
            KAFKA_BROKERS: kafka:9092
            KAFKA_CLIENT_ID: appointment-service
            KAFKA_APPOINTMENT_TOPIC: railgate.appointment.confirmed
        ports:
          - "${APPOINTMENT_SERVICE_PORT}:3000"
        depends_on:
            postgres:
                condition: service_healthy
            kafka:
                condition: service_healthy
        networks:
        - railgate-net
    
    notification-service:
        image: railgate-notification-service:latest
        container_name: railgate-notification-service
        restart: unless-stopped
        build:
            context: ./services/notification-service
            dockerfile: Dockerfile
        environment:
            NODE_ENV: ${NODE_ENV}
            PORT: ${PORT}
            DB_HOST: postgres
            DB_PORT: "5432"
            POSTGRES_USER: ${POSTGRES_PASSWORD}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            NOTIFICATION_DB: ${NOTIFICATION_DB}
            KAFKA_BROKERS: kafka:9092
            KAFKA_APPOINTMENT_TOPIC: railgate.appointments.confirmed
            KAFKA_CONSUMER_GROUP_ID: notification-service-group
        ports:
          - "${NOTIFICATION_SERVICE_PORT}:3000"
        depends_on:
            postgres:
                condition: service_healthy
            kafka:
                condition: service_healthy
        networks:
        - railgate-net